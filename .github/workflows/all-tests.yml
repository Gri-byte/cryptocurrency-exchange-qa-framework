name: All Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  smoke-gate:
    name: Smoke Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'
        cache: maven

    - name: Setup Chrome
      id: setup-chrome
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: stable

    - name: Set Chrome paths
      run: |
        CHROME="${{ steps.setup-chrome.outputs.chrome-path }}"
        CHROMEDRIVER="${{ steps.setup-chrome.outputs.chromedriver-path }}"
        echo "Action output chrome-path:       '${CHROME}'"
        echo "Action output chromedriver-path: '${CHROMEDRIVER}'"
        [ -z "$CHROME" ]       && CHROME=$(which google-chrome-stable 2>/dev/null || which google-chrome 2>/dev/null || which chromium-browser 2>/dev/null || which chromium 2>/dev/null || true)
        [ -z "$CHROMEDRIVER" ] && CHROMEDRIVER=$(which chromedriver 2>/dev/null || true)
        echo "CHROME_BIN=$CHROME" >> $GITHUB_ENV
        echo "CHROMEDRIVER_BIN=$CHROMEDRIVER" >> $GITHUB_ENV
        echo "Chrome:       ${CHROME:-not found}"
        [ -n "$CHROME" ]       && "$CHROME" --version       || true
        echo "ChromeDriver: ${CHROMEDRIVER:-not found}"
        [ -n "$CHROMEDRIVER" ] && "$CHROMEDRIVER" --version || true

    - name: Run smoke tests (fast gate)
      run: |
        DRIVER_ARGS="-Dheadless=true -Dgroups=smoke -DexcludedGroups=api"
        [ -n "$CHROME_BIN" ]       && DRIVER_ARGS="$DRIVER_ARGS -Dchrome.binary=$CHROME_BIN"
        [ -n "$CHROMEDRIVER_BIN" ] && DRIVER_ARGS="$DRIVER_ARGS -Dwebdriver.chrome.driver=$CHROMEDRIVER_BIN"
        mvn clean test --no-transfer-progress $DRIVER_ARGS

    - name: Upload surefire results (on failure)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: smoke-gate-surefire-reports
        path: target/surefire-reports/
        retention-days: 7

  full-suite:
    name: Full Test Suite
    needs: smoke-gate
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'
        cache: maven

    - name: Setup Chrome
      id: setup-chrome
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: stable

    - name: Set Chrome paths
      run: |
        CHROME="${{ steps.setup-chrome.outputs.chrome-path }}"
        CHROMEDRIVER="${{ steps.setup-chrome.outputs.chromedriver-path }}"
        [ -z "$CHROME" ]       && CHROME=$(which google-chrome-stable 2>/dev/null || which google-chrome 2>/dev/null || which chromium-browser 2>/dev/null || which chromium 2>/dev/null || true)
        [ -z "$CHROMEDRIVER" ] && CHROMEDRIVER=$(which chromedriver 2>/dev/null || true)
        echo "CHROME_BIN=$CHROME" >> $GITHUB_ENV
        echo "CHROMEDRIVER_BIN=$CHROMEDRIVER" >> $GITHUB_ENV
        echo "Chrome:       ${CHROME:-not found}"
        [ -n "$CHROME" ]       && "$CHROME" --version       || true
        echo "ChromeDriver: ${CHROMEDRIVER:-not found}"
        [ -n "$CHROMEDRIVER" ] && "$CHROMEDRIVER" --version || true

    - name: Run full test suite (excluding smoke — already passed)
      run: |
        DRIVER_ARGS="-Dheadless=true -DexcludedGroups=smoke"
        [ -n "$CHROME_BIN" ]       && DRIVER_ARGS="$DRIVER_ARGS -Dchrome.binary=$CHROME_BIN"
        [ -n "$CHROMEDRIVER_BIN" ] && DRIVER_ARGS="$DRIVER_ARGS -Dwebdriver.chrome.driver=$CHROMEDRIVER_BIN"
        mvn clean test --no-transfer-progress $DRIVER_ARGS

    - name: Generate Allure report
      if: always()
      run: mvn allure:report --no-transfer-progress

    - name: Upload Allure report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: full-suite-allure-report
        path: target/site/allure-maven-plugin/
        retention-days: 30

    - name: Upload surefire results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: full-suite-surefire-reports
        path: target/surefire-reports/
        retention-days: 7