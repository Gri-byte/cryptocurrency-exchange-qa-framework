name: All Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  smoke-gate:
    name: Smoke Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'
        cache: maven

    - name: Setup Chrome
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: stable

    - name: Locate Chrome binaries
      run: |
        CHROME=$(which google-chrome || which google-chrome-stable || which chromium || which chromium-browser)
        CHROMEDRIVER=$(which chromedriver)
        echo "CHROME_BIN=$CHROME" >> $GITHUB_ENV
        echo "CHROMEDRIVER_BIN=$CHROMEDRIVER" >> $GITHUB_ENV
        echo "Chrome: $CHROME ($($CHROME --version))"
        echo "ChromeDriver: $CHROMEDRIVER ($($CHROMEDRIVER --version))"

    - name: Run smoke tests (fast gate)
      run: |
        mvn clean test -Dgroups=smoke -Dheadless=true \
          -Dwebdriver.chrome.driver="$CHROMEDRIVER_BIN" \
          -Dchrome.binary="$CHROME_BIN"

  full-suite:
    name: Full Test Suite
    needs: smoke-gate
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'
        cache: maven

    - name: Setup Chrome
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: stable

    - name: Locate Chrome binaries
      run: |
        CHROME=$(which google-chrome || which google-chrome-stable || which chromium || which chromium-browser)
        CHROMEDRIVER=$(which chromedriver)
        echo "CHROME_BIN=$CHROME" >> $GITHUB_ENV
        echo "CHROMEDRIVER_BIN=$CHROMEDRIVER" >> $GITHUB_ENV
        echo "Chrome: $CHROME ($($CHROME --version))"
        echo "ChromeDriver: $CHROMEDRIVER ($($CHROMEDRIVER --version))"

    - name: Run full test suite (excluding smoke — already passed)
      run: |
        mvn clean test -DexcludedGroups=smoke -Dheadless=true \
          -Dwebdriver.chrome.driver="$CHROMEDRIVER_BIN" \
          -Dchrome.binary="$CHROME_BIN"

    - name: Generate Allure report
      if: always()
      run: mvn allure:report --no-transfer-progress

    - name: Upload Allure report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: full-suite-allure-report
        path: target/site/allure-maven-plugin/
        retention-days: 30

    - name: Upload surefire results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: full-suite-surefire-reports
        path: target/surefire-reports/
        retention-days: 7
