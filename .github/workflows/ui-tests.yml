name: UI Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'
        cache: maven

    - name: Setup Chrome
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: stable

    - name: Locate Chrome binaries
      run: |
        CHROME=$(which google-chrome-stable 2>/dev/null || which google-chrome 2>/dev/null || which chromium-browser 2>/dev/null || which chromium 2>/dev/null || true)
        CHROMEDRIVER=$(which chromedriver 2>/dev/null || true)
        echo "CHROME_BIN=$CHROME" >> $GITHUB_ENV
        echo "CHROMEDRIVER_BIN=$CHROMEDRIVER" >> $GITHUB_ENV
        echo "Chrome:      ${CHROME:-not found}"
        [ -n "$CHROME" ] && "$CHROME" --version || true
        echo "ChromeDriver: ${CHROMEDRIVER:-not found}"
        [ -n "$CHROMEDRIVER" ] && "$CHROMEDRIVER" --version || true

    - name: Run UI Tests (headless)
      run: |
        DRIVER_ARG=""
        [ -n "$CHROMEDRIVER_BIN" ] && DRIVER_ARG="-Dwebdriver.chrome.driver=$CHROMEDRIVER_BIN"
        mvn clean test --no-transfer-progress \
          -DexcludedGroups=api \
          -Dheadless=true \
          $DRIVER_ARG \
          -Dchrome.binary="$CHROME_BIN"

    - name: Generate Allure report
      if: always()
      run: mvn allure:report --no-transfer-progress

    - name: Upload Allure report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ui-allure-report
        path: target/site/allure-maven-plugin/
        retention-days: 30

    - name: Upload surefire results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ui-surefire-reports
        path: target/surefire-reports/
        retention-days: 7