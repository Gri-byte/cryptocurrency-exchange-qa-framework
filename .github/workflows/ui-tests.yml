name: UI Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'
        cache: maven

    - name: Run UI Tests (headless)
      run: mvn clean test -Dgroups=ui,smoke -Dheadless=true

    - name: Generate Allure report
      if: always()
      run: mvn allure:report --no-transfer-progress

    - name: Upload Allure report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ui-allure-report
        path: target/site/allure-maven-plugin/
        retention-days: 30

    - name: Upload surefire results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ui-surefire-reports
        path: target/surefire-reports/
        retention-days: 7
