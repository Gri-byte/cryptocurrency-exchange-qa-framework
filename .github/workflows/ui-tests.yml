name: UI Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'
        cache: maven

    - name: Setup Chrome
      id: setup-chrome
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: stable

    - name: Install matching ChromeDriver
      run: |
        CHROME="${{ steps.setup-chrome.outputs.chrome-path }}"
        if [ -z "$CHROME" ]; then
          CHROME=$(which google-chrome-stable 2>/dev/null || which google-chrome 2>/dev/null \
                   || which chromium-browser 2>/dev/null || which chromium 2>/dev/null || true)
        fi
        if [ -z "$CHROME" ]; then echo "No Chrome binary found; cannot install chromedriver" >&2; exit 1; fi

        CHROME_VER=$("$CHROME" --version | grep -oP '[\d.]+' | head -1)
        CHROME_MAJOR=$(echo "$CHROME_VER" | cut -d. -f1)
        echo "Chrome $CHROME_VER (major $CHROME_MAJOR)"

        DRIVER_URL=$(curl -fsSL \
          "https://googlechromelabs.github.io/chrome-for-testing/known-good-versions-with-downloads.json" | \
          python3 -c "
        import sys, json
        data = json.load(sys.stdin)
        ver, maj = '$CHROME_VER', '$CHROME_MAJOR'
        match = next((v for v in data['versions'] if v['version'] == ver), None)
        if not match:
            match = next((v for v in reversed(data['versions']) if v['version'].split('.')[0] == maj), None)
        if match:
            for d in match.get('downloads', {}).get('chromedriver', []):
                if d['platform'] == 'linux64':
                    print(d['url']); break
        ")
        if [ -z "$DRIVER_URL" ]; then echo "ChromeDriver URL not found for Chrome $CHROME_VER" >&2; exit 1; fi

        echo "Downloading ChromeDriver from: $DRIVER_URL"
        curl -fsSL "$DRIVER_URL" -o /tmp/chromedriver.zip
        unzip -q /tmp/chromedriver.zip -d /tmp/cdt
        DRIVER=$(find /tmp/cdt -name chromedriver -type f | head -1)
        chmod +x "$DRIVER"
        sudo mv "$DRIVER" /usr/local/bin/chromedriver
        echo "CHROMEDRIVER_BIN=/usr/local/bin/chromedriver" >> $GITHUB_ENV
        chromedriver --version

    - name: Set Chrome paths
      run: |
        CHROME="${{ steps.setup-chrome.outputs.chrome-path }}"
        CHROMEDRIVER="${{ steps.setup-chrome.outputs.chromedriver-path }}"
        [ -z "$CHROME" ]       && CHROME=$(which google-chrome-stable 2>/dev/null || which google-chrome 2>/dev/null || which chromium-browser 2>/dev/null || which chromium 2>/dev/null || true)
        [ -z "$CHROMEDRIVER" ] && CHROMEDRIVER=$(which chromedriver 2>/dev/null || true)
        echo "CHROME_BIN=$CHROME" >> $GITHUB_ENV
        echo "CHROMEDRIVER_BIN=$CHROMEDRIVER" >> $GITHUB_ENV
        echo "Chrome:       ${CHROME:-not found}"
        [ -n "$CHROME" ]       && "$CHROME" --version       || true
        echo "ChromeDriver: ${CHROMEDRIVER:-not found}"
        [ -n "$CHROMEDRIVER" ] && "$CHROMEDRIVER" --version || true

    - name: Run UI Tests (headless)
      run: |
        DRIVER_ARGS="-Dheadless=true -DexcludedGroups=api"
        [ -n "$CHROME_BIN" ]       && DRIVER_ARGS="$DRIVER_ARGS -Dchrome.binary=$CHROME_BIN"
        [ -n "$CHROMEDRIVER_BIN" ] && DRIVER_ARGS="$DRIVER_ARGS -Dwebdriver.chrome.driver=$CHROMEDRIVER_BIN"
        mvn clean test --no-transfer-progress $DRIVER_ARGS

    - name: Generate Allure report
      if: always()
      run: mvn allure:report --no-transfer-progress

    - name: Upload Allure report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ui-allure-report
        path: target/site/allure-maven-plugin/
        retention-days: 30

    - name: Upload surefire results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ui-surefire-reports
        path: target/surefire-reports/
        retention-days: 7